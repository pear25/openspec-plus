name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@latest
      - run: npm test
      - name: Overlay and Claude additions still apply to the latest OpenSpec
        run: XDG_DATA_HOME="$RUNNER_TEMP/xdg" CLAUDE_DIR="$RUNNER_TEMP/claude" scripts/sync.sh
