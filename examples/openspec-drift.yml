# Copy to .github/workflows/openspec-drift.yml. Weekly, Claude compares the
# specs with the code (read-only) and keeps one issue labelled `spec-drift` up
# to date: opened or updated when drift is found, closed when none remains.
# Needs an ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) repository secret;
# each run costs API tokens, bounded by max-turns.
name: openspec drift audit

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      specs:
        description: Spec IDs or prefixes to audit (blank = all)
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write   # claude-code-action authentication

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200   # enough history for the `since` window

      # Pin to a commit SHA or tag for reproducible builds.
      - uses: pear25/openspec-plus/drift@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          specs: ${{ inputs.specs }}
          since: 8 days ago
          max-turns: "80"
